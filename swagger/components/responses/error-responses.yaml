# swagger/components/responses/400.yaml
400:
  description: Bad Request - Invalid input data
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 400
          message:
            type: string
            example: "Validation error: Name must be at least 2 characters long"
          data:
            type: "null"
            example: null

# swagger/components/responses/401.yaml
401:
  description: Unauthorized - Authentication required or invalid token
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 401
          message:
            type: string
            example: "Access token expired"
          data:
            type: "null"
            example: null

# swagger/components/responses/404.yaml
404:
  description: Not Found - Resource not found
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 404
          message:
            type: string
            example: "Contact not found"
          data:
            type: "null"
            example: null

# swagger/components/responses/409.yaml
409:
  description: Conflict - Resource already exists
  content:
    application/json:
      schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 409
          message:
            type: string
            example: "Email in use"
          data:
            type: "null"
            example: null
