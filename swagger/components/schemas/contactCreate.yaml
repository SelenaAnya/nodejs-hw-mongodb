type: object
required:
  - name
  - phoneNumber
properties:
  name:
    description: "Contact's full name"
    type: string
    minLength: 2
    maxLength: 50
    example: "John Doe"
  phoneNumber:
    description: "Contact's phone number"
    type: string
    minLength: 10
    maxLength: 20
    pattern: '^[\+]?[\d\s\-\(\)]+$'
    example: "+380501234567"
  email:
    description: "Contact's email address (optional)"
    type: string
    format: email
    maxLength: 50
    example: "john.doe@example.com"
  isFavourite:
    description: "Whether the contact is marked as favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Type of contact"
    type: string
    enum: ["work", "home", "personal"]
    default: "personal"
    example: "personal"
