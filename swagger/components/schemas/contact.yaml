type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - isFavourite
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's unique identifier"
    type: string
    pattern: "^[0-9a-fA-F]{24}$"
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's full name"
    type: string
    minLength: 2
    maxLength: 50
    example: "John Doe"
  phoneNumber:
    description: "Contact's phone number"
    type: string
    minLength: 10
    maxLength: 20
    example: "+380501234567"
  email:
    description: "Contact's email address"
    type: string
    format: email
    maxLength: 50
    example: "john.doe@example.com"
  isFavourite:
    description: "Whether the contact is marked as favourite"
    type: boolean
    example: false
  contactType:
    description: "Type of contact"
    type: string
    enum: ["work", "home", "personal"]
    example: "personal"
  photo:
    description: "URL to contact's photo"
    type: string
    format: uri
    example: https://res.cloudinary.com/ddnsttloi/image/upload/v1234567890/contacts/contact_photo.png
  userId:
    description: "ID of the user who owns this contact"
    type: string
    pattern: "^[0-9a-fA-F]{24}$"
    example: 65e4decdd286b30065d54af8
  createdAt:
    description: "Timestamp when the contact was created"
    type: string
    format: date-time
    example: "2023-12-01T10:30:00.000Z"
  updatedAt:
    description: "Timestamp when the contact was last updated"
    type: string
    format: date-time
    example: "2023-12-01T15:45:00.000Z"
