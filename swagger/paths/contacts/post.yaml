tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: "Create a new contact with photo upload support"
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            minLength: 2
            maxLength: 50
            example: "John Doe"
            description: "Contact's full name"
          phoneNumber:
            type: string
            minLength: 10
            maxLength: 20
            pattern: '^[\+]?[\d\s\-\(\)]+$'
            example: "+380501234567"
            description: "Contact's phone number"
          email:
            type: string
            format: email
            maxLength: 50
            example: "john.doe@example.com"
            description: "Contact's email address (optional)"
          contactType:
            type: string
            enum: ["work", "home", "personal"]
            default: "personal"
            example: "personal"
            description: "Type of contact"
          isFavourite:
            type: boolean
            default: false
            example: false
            description: "Whether the contact is marked as favourite"
          photo:
            type: string
            format: binary
            description: "Contact photo (image file, max 5MB)"
responses:
  "201":
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created a contact!"
            data:
              $ref: "../../components/schemas/contact.yaml"
  "400":
    $ref: "../../components/responses/400.yaml"
  "401":
    $ref: "../../components/responses/401.yaml"
