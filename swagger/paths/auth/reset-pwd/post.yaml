tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: "Reset user password using token from email"
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: Reset token from email
            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          password:
            type: string
            minLength: 6
            description: New password
            example: "newpassword123"
responses:
  "200":
    description: Password reset successful
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              example: {}
  "400":
    $ref: "../../../components/responses/400.yaml"
  "401":
    description: Token is expired or invalid
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Token is expired or invalid.
            data:
              type: "null"
  "404":
    description: User not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: User not found!
            data:
              type: "null"
