tags:
  - Auth
summary: Login user
operationId: loginUser
description: "Authenticate user and return access token"
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: "john.doe@example.com"
          password:
            type: string
            example: "password123"
responses:
  "200":
    description: Login successful
    headers:
      Set-Cookie:
        schema:
          type: string
          example: refreshToken=abc123; HttpOnly; Path=/; Secure; SameSite=Strict
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  "400":
    $ref: "../../../components/responses/400.yaml"
  "401":
    description: Invalid credentials
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Invalid credentials
            data:
              type: "null"
