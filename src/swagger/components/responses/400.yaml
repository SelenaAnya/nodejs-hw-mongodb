description: Bad Request - Invalid input data
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: "Validation error: Name must be at least 2 characters long"
        data:
          type: "null"
          example: null
