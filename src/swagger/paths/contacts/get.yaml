tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: "Retrieve a paginated list of contacts with optional filtering and sorting"
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
    description: Number of contacts per page
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        - "_id"
        - "name"
        - "phoneNumber"
        - "email"
        - "contactType"
        - "isFavourite"
        - "createdAt"
        - "updatedAt"
      default: "_id"
    description: Field to sort by
    example: "name"
  - in: query
    name: sortOrder
    schema:
      type: string
      enum:
        - "asc"
        - "desc"
      default: "asc"
    description: Sort order
    example: "asc"
  - in: query
    name: type
    schema:
      type: string
      enum:
        - "work"
        - "home"
        - "personal"
    description: Filter by contact type
    example: "work"
  - in: query
    name: isFavourite
    schema:
      type: string
      enum:
        - "true"
        - "false"
    description: Filter by favourite status
    example: "true"
responses:
  "200":
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: "../../components/schemas/contact.yaml"
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 25
                totalPages:
                  type: integer
                  example: 3
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  "401":
    $ref: "../../components/responses/401.yaml"
