tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: "Refresh access token using refresh token from cookies"
parameters:
  - in: cookie
    name: refreshToken
    required: true
    schema:
      type: string
    description: Refresh token stored in HTTP-only cookie
responses:
  "200":
    description: Token refreshed successfully
    headers:
      Set-Cookie:
        schema:
          type: string
          example: refreshToken=abc123; HttpOnly; Path=/; Secure; SameSite=Strict
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
  "401":
    description: Refresh token is required or invalid
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Refresh token is required
            data:
              type: "null"
