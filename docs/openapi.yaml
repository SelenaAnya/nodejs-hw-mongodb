openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Management API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: API for managing personal contacts with authentication
tags:
  - name: Contacts
    description: Operations about contacts
  - name: Auth
    description: Auth operations
servers:
  - url: http://localhost:3000
  - url: https://hw7-swagger-lmoe.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{contactId}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{contactId}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{contactId}/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register/post.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login/post.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout/post.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh/post.yaml
  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/send-reset-email/post.yaml
  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auth/reset-pwd/post.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    contact:
      $ref: ../swagger/components/schemas/contact.yaml
    contactCreate:
      $ref: ../swagger/components/schemas/contactCreate.yaml
    contactUpdate:
      $ref: ../swagger/components/schemas/contactUpdate.yaml
    user:
      $ref: ../swagger/components/schemas/user.yaml
  responses:
    400:
      $ref: ../swagger/components/responses/400.yaml
    401:
      $ref: ../swagger/components/responses/401.yaml
    404:
      $ref: ../swagger/components/responses/404.yaml
